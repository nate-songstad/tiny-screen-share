<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Screenpeek</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #24352e; background: #f5f6f4; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .card { max-width: 420px; margin: 24px; padding: 36px; background: #fff; border: 1px solid #e1e6df; border-radius: 20px; text-align: center; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -.5px; margin: 0 0 10px; }
    p { color: #68756e; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
    button { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 11px 20px; border-radius: 9px; border: 0; background: #254c3b; color: #fff; cursor: pointer; }
    button:focus-visible { outline: 3px solid #81ae92; outline-offset: 3px; }
    .small { font-size: 12px; margin: 16px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Can’t reach Screenpeek</h1>
    <p>Check your internet connection. We’ll keep trying.</p>
    <button id="retry" type="button" autofocus>Try again</button>
    <p class="small" id="next" role="status"></p>
  </main>
  <script src="./offline.js"></script>
</body>
</html>
